<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4-Player Matchmaking Chat</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --muted: #9ca3af;
      --text: #f3f4f6;
      --accent: #22c55e;
      --border: #1f2937;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(135deg, #0b1220, #0f172a);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .app {
      width: min(760px, 100%);
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    .header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }
    .screen { display: none; padding: 20px; }
    .screen.active { display: block; }
    .status { color: var(--muted); margin-bottom: 12px; }
    .pill {
      display: inline-block;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.15);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.4);
      margin-bottom: 10px;
    }
    .chat-box {
      height: 340px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: rgba(2, 6, 23, 0.5);
      margin-bottom: 12px;
    }
    .msg {
      padding: 8px 10px;
      border-radius: 8px;
      background: #1f2937;
      margin: 8px 0;
      cursor: pointer;
      transition: background 0.15s;
      user-select: none;
    }
    .msg:hover { background: #374151; }
    .system { color: #93c5fd; font-size: 14px; margin: 8px 0; }
    .composer { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      background: var(--accent);
      color: #052e16;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">Real-Time 4-Player Matchmaking Chat</div>

    <section id="lobbyScreen" class="screen active">
      <div class="pill">Lobby / Waiting</div>
      <div id="queueStatus" class="status">Connecting...</div>
      <div class="status">You will be auto-matched when 4 players are in queue.</div>
    </section>

    <section id="chatScreen" class="screen">
      <div class="pill">Active Chat</div>
      <div id="roomInfo" class="status"></div>
      <div id="chatBox" class="chat-box"></div>
      <form id="chatForm" class="composer">
        <input id="chatInput" type="text" placeholder="Type message..." autocomplete="off" />
        <button type="submit">Send</button>
      </form>
      <div class="status">Tip: click a message to toggle translated text.</div>
    </section>
  </div>

  <script>
    const lobbyScreen = document.getElementById("lobbyScreen");
    const chatScreen = document.getElementById("chatScreen");
    const queueStatus = document.getElementById("queueStatus");
    const roomInfo = document.getElementById("roomInfo");
    const chatBox = document.getElementById("chatBox");
    const chatForm = document.getElementById("chatForm");
    const chatInput = document.getElementById("chatInput");

    const wsProtocol = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${wsProtocol}://${location.host}/ws`);
    let currentRoom = null;

    function appendSystemMessage(text) {
      const el = document.createElement("div");
      el.className = "system";
      el.textContent = text;
      chatBox.appendChild(el);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendChatMessage(text) {
      const el = document.createElement("div");
      el.className = "msg";
      el.dataset.original = text;
      el.dataset.translated = "";
      el.dataset.isTranslated = "false";
      el.textContent = text;

      el.addEventListener("click", async () => {
        const isTranslated = el.dataset.isTranslated === "true";
        if (!isTranslated) {
          if (!el.dataset.translated) {
            el.dataset.translated = await mockTranslate(el.dataset.original);
          }
          el.textContent = el.dataset.translated;
          el.dataset.isTranslated = "true";
        } else {
          el.textContent = el.dataset.original;
          el.dataset.isTranslated = "false";
        }
      });

      chatBox.appendChild(el);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function mockTranslate(text) {
      await new Promise((resolve) => setTimeout(resolve, 250));
      return `[Translated] ${text.split("").reverse().join("")}`;
    }

    ws.onopen = () => {
      queueStatus.textContent = "Connected. Entered waiting pool.";
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.type === "queue_status") {
        queueStatus.textContent = data.message;
      }
      if (data.type === "matched") {
        currentRoom = data.room_id;
        roomInfo.textContent = `Room ID: ${currentRoom}`;
        lobbyScreen.classList.remove("active");
        chatScreen.classList.add("active");
        appendSystemMessage("Matched! You are now in active chat.");
      }
      if (data.type === "chat") {
        appendChatMessage(data.text);
      }
      if (data.type === "user_disconnected") {
        appendSystemMessage(data.message);
      }
    };

    ws.onclose = () => {
      if (currentRoom) {
        appendSystemMessage("Connection closed.");
      } else {
        queueStatus.textContent = "Disconnected from server.";
      }
    };

    chatForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;

      appendSystemMessage(`You: ${text}`);
      ws.send(JSON.stringify({ type: "chat", text }));
      chatInput.value = "";
      chatInput.focus();
    });
  </script>
</body>
</html>
