<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>most</title>
  <style>
    :root {
      --text: #ecf1ff;
      --muted: #99a7d1;
      --border: #2a3a67;
      --card: rgba(15, 22, 44, 0.8);
      --chip: rgba(100, 129, 255, 0.18);
      --accent: #6d7bff;
      --accent-soft: #95a2ff;
      --good: #38c984;
      --danger: #f06d6d;
      --msg-bg: #1b2748;
      --msg-border: #3b4f89;
    }
    [data-theme="sunset"] {
      --accent: #ff8c5a;
      --accent-soft: #ffb08c;
      --chip: rgba(255, 138, 94, 0.2);
      --msg-bg: #402437;
      --msg-border: #7a4b65;
    }
    [data-theme="forest"] {
      --accent: #4dcf8f;
      --accent-soft: #8ce6b8;
      --chip: rgba(79, 205, 143, 0.2);
      --msg-bg: #1f3b36;
      --msg-border: #3f6f63;
    }
    [data-theme="midnight"] {
      --accent: #8f6dff;
      --accent-soft: #b39fff;
      --chip: rgba(143, 109, 255, 0.2);
      --msg-bg: #211d44;
      --msg-border: #4c4490;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, #253a84 0%, transparent 45%),
        radial-gradient(circle at 85% 0%, #3d2468 0%, transparent 35%),
        linear-gradient(140deg, #0a0f23 0%, #111933 60%, #0f1429 100%);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: min(920px, 100%);
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--card);
      backdrop-filter: blur(12px);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 22px;
      letter-spacing: 0.5px;
      font-weight: 800;
      text-transform: lowercase;
    }

    .pill,
    .theme-pill {
      font-size: 12px;
      border: 1px solid #3f528f;
      background: var(--chip);
      color: #b8c8ff;
      border-radius: 999px;
      padding: 6px 10px;
      display: inline-block;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 620px;
    }

    .sidebar {
      border-right: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: rgba(5, 10, 22, 0.35);
    }

    .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .status {
      color: #cbd6ff;
      line-height: 1.35;
      min-height: 40px;
    }

    .mode-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 650;
      color: #0d1537;
      background: #d8e1ff;
      transition: transform 0.14s ease, filter 0.14s ease;
    }
    button:hover { transform: translateY(-1px); filter: brightness(1.02); }
    button:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .primary { background: linear-gradient(140deg, var(--accent), var(--accent-soft)); color: #f5f7ff; }
    .success { background: linear-gradient(140deg, var(--good), #94efbf); color: #052012; }
    .danger { background: linear-gradient(140deg, var(--danger), #f9a8a8); color: #2f0808; }

    .screen {
      padding: 20px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .screen.active { display: flex; }

    .chat-head {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: #d0dbff;
      background: rgba(5, 12, 28, 0.45);
    }

    .chat-box {
      flex: 1;
      min-height: 380px;
      max-height: 440px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      background: rgba(3, 8, 20, 0.55);
    }

    .message {
      margin: 8px 0;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--msg-bg);
      border: 1px solid var(--msg-border);
      color: #e2e9ff;
    }
    .message-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .sender {
      font-size: 12px;
      font-weight: 700;
    }
    .translate {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid #4d5f95;
      background: rgba(10, 18, 37, 0.55);
      color: #c9d4fb;
      cursor: pointer;
    }
    .reaction-row {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .reaction-btn {
      font-size: 12px;
      line-height: 1;
      padding: 5px 7px;
      border-radius: 8px;
      border: 1px solid #4f6298;
      background: rgba(8, 16, 34, 0.65);
      color: #d7e3ff;
      cursor: pointer;
    }

    .system {
      margin: 8px 0;
      color: #9ec5ff;
      font-size: 14px;
    }

    .composer {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    input[type="text"] {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      background: rgba(7, 12, 25, 0.6);
      color: var(--text);
      outline: none;
    }
    input[type="color"] {
      width: 100%;
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      padding: 4px;
    }
    select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      background: rgba(7, 12, 25, 0.6);
      color: var(--text);
      outline: none;
    }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand">most</div>
      <div>
        <span id="themeBadge" class="theme-pill">Theme: nebula</span>
        <span id="stateChip" class="pill">Idle</span>
      </div>
    </div>

    <div class="layout">
      <aside class="sidebar">
        <div class="card">
          <div class="label">Profile (saved on device)</div>
          <input id="nicknameInput" type="text" maxlength="24" placeholder="Nickname" />
          <div style="height:8px;"></div>
          <input id="colorInput" type="color" />
          <div style="height:8px;"></div>
          <select id="themeSelect">
            <option value="nebula">Nebula</option>
            <option value="sunset">Sunset</option>
            <option value="forest">Forest</option>
            <option value="midnight">Midnight</option>
          </select>
          <button id="saveProfileBtn" class="success" style="margin-top:10px;">Save Profile</button>
        </div>

        <div class="card">
          <div class="label">Match Size</div>
          <div class="mode-row">
            <button id="join2" class="primary">Join 2-Player</button>
            <button id="join4" class="primary">Join 4-Player</button>
          </div>
        </div>

        <div class="card">
          <div class="label">Queue</div>
          <div id="queueStatus" class="status">Connecting...</div>
          <button id="leaveQueue" class="danger" style="margin-top:10px;">Leave Queue</button>
        </div>

        <div class="card">
          <div class="label">Room</div>
          <div id="roomInfo" class="status">Not in a room.</div>
          <button id="leaveRoom" class="danger" style="margin-top:10px;">Exit Chat</button>
        </div>
      </aside>

      <main>
        <section id="lobbyScreen" class="screen active">
          <div class="chat-head">
            Choose matchmaking mode and join a queue. Leaving queue or chat will keep you out until you join again.
          </div>
        </section>

        <section id="chatScreen" class="screen">
          <div class="chat-head">Use Translate on each message and react with emoji.</div>
          <div id="chatBox" class="chat-box"></div>
          <form id="chatForm" class="composer">
            <input id="chatInput" type="text" placeholder="Type a message..." autocomplete="off" />
            <button class="success" type="submit">Send</button>
          </form>
        </section>
      </main>
    </div>
  </div>

  <script>
    const stateChip = document.getElementById("stateChip");
    const themeBadge = document.getElementById("themeBadge");
    const queueStatus = document.getElementById("queueStatus");
    const roomInfo = document.getElementById("roomInfo");
    const join2 = document.getElementById("join2");
    const join4 = document.getElementById("join4");
    const leaveQueueBtn = document.getElementById("leaveQueue");
    const leaveRoomBtn = document.getElementById("leaveRoom");
    const nicknameInput = document.getElementById("nicknameInput");
    const colorInput = document.getElementById("colorInput");
    const themeSelect = document.getElementById("themeSelect");
    const saveProfileBtn = document.getElementById("saveProfileBtn");
    const lobbyScreen = document.getElementById("lobbyScreen");
    const chatScreen = document.getElementById("chatScreen");
    const chatBox = document.getElementById("chatBox");
    const chatForm = document.getElementById("chatForm");
    const chatInput = document.getElementById("chatInput");

    const wsProtocol = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${wsProtocol}://${location.host}/ws`);

    const profile = loadProfile();
    let myClientId = profile.clientId;
    let myNickname = profile.nickname;
    let myColor = profile.color;
    let myTheme = profile.theme;
    let currentRoom = null;
    let selectedSize = null;
    let inQueue = false;
    let inRoom = false;
    const messageEls = new Map();

    nicknameInput.value = myNickname;
    colorInput.value = myColor;
    themeSelect.value = myTheme;
    applyTheme(myTheme);

    function renderStateChip() {
      let label = "Idle";
      if (inRoom) label = "In Chat";
      else if (inQueue) label = "Waiting";
      stateChip.textContent = label;
    }

    function renderButtons() {
      const connected = ws.readyState === WebSocket.OPEN;
      join2.disabled = !connected || inRoom;
      join4.disabled = !connected || inRoom;
      leaveQueueBtn.disabled = !connected || !inQueue;
      leaveRoomBtn.disabled = !connected || !inRoom;
    }

    function showLobby() {
      lobbyScreen.classList.add("active");
      chatScreen.classList.remove("active");
    }

    function showChat() {
      lobbyScreen.classList.remove("active");
      chatScreen.classList.add("active");
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      themeBadge.textContent = `Theme: ${theme}`;
    }

    function loadProfile() {
      let raw = null;
      try {
        raw = JSON.parse(localStorage.getItem("most_profile") || "{}");
      } catch (_) {
        raw = {};
      }
      return {
        clientId: raw.clientId || crypto.randomUUID(),
        nickname: raw.nickname || "Guest",
        color: raw.color || "#6d7bff",
        theme: raw.theme || "nebula"
      };
    }

    function saveProfileToDevice() {
      const payload = {
        clientId: myClientId,
        nickname: myNickname,
        color: myColor,
        theme: myTheme
      };
      localStorage.setItem("most_profile", JSON.stringify(payload));
    }

    function appendSystemMessage(text) {
      const el = document.createElement("div");
      el.className = "system";
      el.textContent = text;
      chatBox.appendChild(el);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function updateReactionRow(target, message) {
      target.innerHTML = "";
      const reactions = message.reactions || {};
      const options = ["👍", "😂", "🔥", "❤️"];
      for (const emoji of options) {
        const count = (reactions[emoji] || []).length;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "reaction-btn";
        btn.textContent = count ? `${emoji} ${count}` : emoji;
        btn.addEventListener("click", () => {
          if (!currentRoom) return;
          ws.send(JSON.stringify({ type: "react", message_id: message.id, emoji }));
        });
        target.appendChild(btn);
      }
    }

    function appendMessage(message) {
      const el = document.createElement("div");
      el.className = "message";
      el.dataset.messageId = message.id;

      const head = document.createElement("div");
      head.className = "message-head";

      const sender = document.createElement("div");
      sender.className = "sender";
      sender.textContent = message.sender.nickname;
      sender.style.color = message.sender.color || "#c8d5ff";
      head.appendChild(sender);

      const translateBtn = document.createElement("button");
      translateBtn.type = "button";
      translateBtn.className = "translate";
      translateBtn.textContent = "Translate";
      head.appendChild(translateBtn);

      const content = document.createElement("div");
      content.textContent = message.text;
      content.dataset.original = message.text;
      content.dataset.translated = "";
      content.dataset.isTranslated = "false";

      translateBtn.addEventListener("click", async () => {
        const isTranslated = content.dataset.isTranslated === "true";
        if (!isTranslated) {
          if (!content.dataset.translated) {
            content.dataset.translated = await mockTranslate(content.dataset.original);
          }
          content.textContent = content.dataset.translated;
          content.dataset.isTranslated = "true";
          translateBtn.textContent = "Original";
        } else {
          content.textContent = content.dataset.original;
          content.dataset.isTranslated = "false";
          translateBtn.textContent = "Translate";
        }
      });

      const reactionRow = document.createElement("div");
      reactionRow.className = "reaction-row";
      updateReactionRow(reactionRow, message);

      el.appendChild(head);
      el.appendChild(content);
      el.appendChild(reactionRow);
      chatBox.appendChild(el);
      messageEls.set(message.id, { root: el, reactionRow, message });
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function mockTranslate(text) {
      await new Promise((resolve) => setTimeout(resolve, 220));

      const hasCyrillic = /[А-Яа-яЁё]/.test(text);
      if (!hasCyrillic) {
        return `[Translation unavailable] Only Russian input is currently supported.`;
      }

      const phraseMap = new Map([
        ["привет", "hello"],
        ["как дела", "how are you"],
        ["спасибо", "thanks"],
        ["пожалуйста", "please"],
        ["да", "yes"],
        ["нет", "no"],
        ["доброе утро", "good morning"],
        ["добрый день", "good afternoon"],
        ["добрый вечер", "good evening"],
        ["пока", "bye"],
        ["извини", "sorry"],
        ["я здесь", "i am here"],
        ["я готов", "i am ready"],
        ["поехали", "let's go"],
        ["где ты", "where are you"],
        ["я не понимаю", "i don't understand"]
      ]);

      const wordMap = new Map([
        ["привет", "hello"],
        ["мир", "world"],
        ["я", "i"],
        ["ты", "you"],
        ["он", "he"],
        ["она", "she"],
        ["мы", "we"],
        ["они", "they"],
        ["готов", "ready"],
        ["готова", "ready"],
        ["иду", "coming"],
        ["здесь", "here"],
        ["там", "there"],
        ["комната", "room"],
        ["игра", "game"],
        ["начали", "started"],
        ["подожди", "wait"],
        ["почему", "why"],
        ["где", "where"],
        ["когда", "when"],
        ["сейчас", "now"],
        ["позже", "later"],
        ["спасибо", "thanks"]
      ]);

      let normalized = text.toLowerCase();
      for (const [ru, en] of phraseMap.entries()) {
        normalized = normalized.replaceAll(ru, en);
      }

      const translated = normalized.replace(/[а-яё]+/gi, (token) => {
        const lower = token.toLowerCase();
        return wordMap.get(lower) || token;
      });

      return `[EN] ${translated}`;
    }

    join2.addEventListener("click", () => joinQueue(2));
    join4.addEventListener("click", () => joinQueue(4));
    saveProfileBtn.addEventListener("click", () => {
      myNickname = (nicknameInput.value || "Guest").trim().slice(0, 24) || "Guest";
      myColor = colorInput.value || "#6d7bff";
      myTheme = themeSelect.value || "nebula";
      applyTheme(myTheme);
      saveProfileToDevice();
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: "profile_update",
          nickname: myNickname,
          color: myColor,
          theme: myTheme
        }));
      }
      appendSystemMessage("Profile saved on this device.");
    });

    function joinQueue(size) {
      if (ws.readyState !== WebSocket.OPEN) return;
      selectedSize = size;
      ws.send(JSON.stringify({ type: "join_queue", size }));
      inQueue = true;
      inRoom = false;
      currentRoom = null;
      roomInfo.textContent = "Waiting for match...";
      queueStatus.textContent = `Joining ${size}-player queue...`;
      showLobby();
      renderStateChip();
      renderButtons();
    }

    leaveQueueBtn.addEventListener("click", () => {
      if (ws.readyState !== WebSocket.OPEN || !inQueue) return;
      ws.send(JSON.stringify({ type: "leave_queue" }));
      inQueue = false;
      queueStatus.textContent = "You left the queue.";
      renderStateChip();
      renderButtons();
    });

    leaveRoomBtn.addEventListener("click", () => {
      if (ws.readyState !== WebSocket.OPEN || !inRoom) return;
      ws.send(JSON.stringify({ type: "leave_room" }));
      inRoom = false;
      inQueue = false;
      currentRoom = null;
      roomInfo.textContent = "Not in a room.";
      showLobby();
      renderStateChip();
      renderButtons();
    });

    ws.onopen = () => {
      ws.send(JSON.stringify({
        type: "hello",
        client_id: myClientId,
        nickname: myNickname,
        color: myColor,
        theme: myTheme
      }));
      queueStatus.textContent = "Connected. Choose 2-player or 4-player queue.";
      renderStateChip();
      renderButtons();
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.type === "connected") {
        queueStatus.textContent = data.message;
      }

      if (data.type === "hello_ack") {
        myClientId = data.client_id;
        myNickname = data.nickname;
        myColor = data.color;
        myTheme = data.theme;
        nicknameInput.value = myNickname;
        colorInput.value = myColor;
        themeSelect.value = myTheme;
        applyTheme(myTheme);
        saveProfileToDevice();
      }

      if (data.type === "queue_status" && selectedSize === data.size) {
        queueStatus.textContent = data.message;
      }

      if (data.type === "matched" || data.type === "reconnected") {
        inQueue = false;
        inRoom = true;
        selectedSize = data.size;
        currentRoom = data.room_id;
        if (data.theme) {
          applyTheme(data.theme);
        }
        roomInfo.textContent = `Room ${currentRoom} (${data.size} players)`;
        chatBox.innerHTML = "";
        messageEls.clear();
        for (const message of (data.messages || [])) {
          appendMessage(message);
        }
        showChat();
        appendSystemMessage(data.type === "reconnected" ? "Reconnected to your room." : "Matched. Chat started.");
      }

      if (data.type === "queue_left") {
        inQueue = false;
        renderStateChip();
        renderButtons();
      }

      if (data.type === "room_left") {
        inRoom = false;
        inQueue = false;
        currentRoom = null;
        roomInfo.textContent = "Not in a room.";
        showLobby();
      }

      if (data.type === "chat") {
        appendMessage(data.message);
      }

      if (data.type === "reaction_update") {
        const store = messageEls.get(data.message_id);
        if (store) {
          store.message.reactions = data.reactions || {};
          updateReactionRow(store.reactionRow, store.message);
        }
      }

      if (
        data.type === "user_disconnected" ||
        data.type === "user_left_room" ||
        data.type === "user_reconnected" ||
        data.type === "user_removed"
      ) {
        appendSystemMessage(data.message);
      }

      if (data.type === "profile_saved") {
        appendSystemMessage("Profile synced.");
      }

      if (data.type === "error") {
        appendSystemMessage(data.message);
      }

      renderStateChip();
      renderButtons();
    };

    ws.onclose = () => {
      queueStatus.textContent = "Connection closed.";
      inQueue = false;
      inRoom = false;
      currentRoom = null;
      showLobby();
      renderStateChip();
      renderButtons();
    };

    chatForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!inRoom || ws.readyState !== WebSocket.OPEN) return;

      const text = chatInput.value.trim();
      if (!text) return;
      ws.send(JSON.stringify({ type: "chat", text }));
      chatInput.value = "";
      chatInput.focus();
    });

    renderButtons();
  </script>
</body>
</html>
